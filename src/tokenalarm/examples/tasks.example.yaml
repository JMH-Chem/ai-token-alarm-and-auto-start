# TokenAlarm 작업 큐 — 남는 사용량으로 실행할 작업들
#
# kind:
#   repo     : 지정한 git 저장소에서 별도 worktree + 새 브랜치(tokenalarm/<id>/<시각>)를 만들어 작업. push 금지.
#   research : 출력 폴더(<output_dir>/<id>/<시각>/)에서 조사·보고서 작성 (웹 검색 허용)
#   study    : 출력 폴더에서 학습 노트·문제 생성 등
# repeat: once(한 번) | daily(하루 1회) | weekly(주 1회) | always(매번)
# priority: 높을수록 먼저. 중간에 멈춘 작업(partial)은 다음 기회에 같은 세션으로 이어서 실행됩니다.
# 권한: allowed_tools 에 있는 도구만 자동 승인됩니다. 지정하지 않으면 kind 별 안전한 기본값을 씁니다.

defaults:
  model: sonnet
  chunk_turns: 15

tasks:
  - id: weekly-ai-news
    kind: research
    repeat: weekly
    priority: 5
    prompt_file: prompts/research_weekly.md
    output_dir: ~/TokenAlarm/research

  - id: study-notes
    kind: study
    repeat: weekly
    priority: 3
    prompt_file: prompts/study_notes.md
    output_dir: ~/TokenAlarm/study
    enabled: false               # 사용할 때 true 로 바꾸고 prompt 파일을 내 상황에 맞게 수정

  - id: myrepo-tests
    kind: repo
    repo: C:/dev/myrepo           # ← 내 저장소 경로로 변경
    repeat: weekly
    priority: 10
    prompt_file: prompts/repo_tests.md
    enabled: false
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git add:*)"
      - "Bash(git commit:*)"
      - "Bash(pytest:*)"          # 저장소의 테스트 명령에 맞게 변경 (예: "Bash(npm test:*)")
