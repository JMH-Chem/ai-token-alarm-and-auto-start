[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenalarm"
dynamic = ["version"]
description = "Forecast your Claude subscription usage and spend leftover quota on your own queued tasks before it resets (Windows-first)."
readme = "README.en.md"
requires-python = ">=3.10"
authors = [{ name = "JMH-Chem" }]
keywords = ["claude", "claude-code", "anthropic", "usage", "quota", "rate-limit", "automation", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Korean",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "pyyaml>=6.0",
  "platformdirs>=3.0",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]
windows = []  # kept so v0.1 instructions (`pip install .[windows]`) still work
dev = ["pytest>=7", "ruff>=0.5", "build>=1.0", "twine>=5", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/JMH-Chem/ai-token-alarm-and-auto-start"
Issues = "https://github.com/JMH-Chem/ai-token-alarm-and-auto-start/issues"
Changelog = "https://github.com/JMH-Chem/ai-token-alarm-and-auto-start/blob/main/CHANGELOG.md"

[project.scripts]
tokenalarm = "tokenalarm.cli:main"
tokenalarm-hook = "tokenalarm.integrations:hook_entry"
tokenalarm-statusline = "tokenalarm.integrations:statusline_entry"

[project.gui-scripts]
tokenalarmw = "tokenalarm.cli:main_gui"

[tool.setuptools.dynamic]
version = { attr = "tokenalarm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenalarm = ["examples/*.yaml", "examples/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]
